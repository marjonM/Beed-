<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: sticky header + scrollable tab strip; each tab is a work surface of tables, forms and weekly grids. Campus green ink, harvest-gold accent. */
:root{
  --bg:#f5f7f4; --panel:#ffffff; --ink:#15231b; --muted:#5b6a60; --line:#dbe3dc; --soft:#eaf0eb;
  --accent:#1f6b45; --accent-ink:#ffffff; --gold:#b8860b; --gold-soft:#fbf1d6;
  --ok:#1e7a46; --ok-soft:#e1f3e8; --warn:#9a6200; --warn-soft:#fdf0d5; --bad:#b4332a; --bad-soft:#fbe4e1; --info:#2a5d9f; --info-soft:#e3ecf8;
  --e0:#dff0e6; --e1:#fbefd2; --e2:#e1eaf8; --e3:#f6e0e6; --e4:#e9e3f6; --e5:#dcf0f0; --e6:#f3e7da; --e7:#e8eedb;
  --eb:#9fb9a7;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#5fbf8a; --accent-ink:#0b140f; --gold:#e3b54a; --gold-soft:#3a3016;
  --ok:#6fcf97; --ok-soft:#1b3326; --warn:#e8b04a; --warn-soft:#3a2d12; --bad:#f08a80; --bad-soft:#3d1c1a; --info:#8db6ee; --info-soft:#1b2a40;
  --e0:#1f3a2b; --e1:#3b3218; --e2:#1f2c45; --e3:#3e2029; --e4:#2c2542; --e5:#18393a; --e6:#3a2c1e; --e7:#2c3520; --eb:#3f5a48;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1712; --panel:#16211a; --ink:#e4ece6; --muted:#9aaa9f; --line:#2a3a30; --soft:#1d2b22;
  --accent:#5fbf8a; --accent-ink:#0b140f; --gold:#e3b54a; --gold-soft:#3a3016;
  --ok:#6fcf97; --ok-soft:#1b3326; --warn:#e8b04a; --warn-soft:#3a2d12; --bad:#f08a80; --bad-soft:#3d1c1a; --info:#8db6ee; --info-soft:#1b2a40;
  --e0:#1f3a2b; --e1:#3b3218; --e2:#1f2c45; --e3:#3e2029; --e4:#2c2542; --e5:#18393a; --e6:#3a2c1e; --e7:#2c3520; --eb:#3f5a48;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:12px 6px}
.brand h1{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:22px;letter-spacing:.01em;margin:0;text-wrap:balance}
.brand .term{font-size:13px;color:var(--muted)}
.brand .sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)} .dot.local{background:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:600 14px var(--f-body);background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
nav.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 60px}
h2{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:20px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-stretch:90%;font-weight:700;font-size:16px;margin:0}
.eyebrow{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
button.btn,label.btn{font:600 14px var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
button.btn:hover,label.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.danger.armed{background:var(--bad);color:var(--panel)}
button.link{background:none;border:0;color:var(--accent);font:600 13px var(--f-body);cursor:pointer;padding:2px 4px}
button.link.del{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
input[type=number]{width:90px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--f-display);font-stretch:80%;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font:600 12px var(--f-body);padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-gold{background:var(--gold-soft);color:var(--gold)} .p-mute{background:var(--soft);color:var(--muted)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.grouprow td{background:var(--soft);font-weight:700;font-family:var(--f-display);font-stretch:90%}
.bar{height:8px;background:var(--soft);border-radius:4px;position:relative;overflow:hidden;min-width:90px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.bar i.over{background:var(--warn)} .bar i.bad{background:var(--bad)}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.callout{border-left:4px solid var(--gold);background:var(--gold-soft);padding:12px 14px;border-radius:0 var(--r) var(--r) 0}
.callout.ok{border-color:var(--ok);background:var(--ok-soft)}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)}
.callout ul{margin:6px 0 0;padding-left:18px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;counter-reset:s}
.steps>div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;counter-increment:s}
.steps>div::before{content:counter(s);font:700 13px var(--f-mono);color:var(--gold);display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);font:600 14px var(--f-body);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* timetable */
.ttbox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.tt{display:grid;grid-template-columns:92px repeat(5,minmax(110px,1fr));min-width:660px}
.tt .hd{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line);background:var(--soft)}
.tt .times{position:relative;border-right:1px solid var(--line)}
.tt .times span{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;font:400 10.5px var(--f-mono);color:var(--muted);border-top:1px solid var(--soft);white-space:nowrap}
.tt .times span.hr{border-top-color:var(--line);color:var(--ink)}
.tt .day{position:relative;border-right:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(var(--soft) 1px,transparent 1px);background-size:100% calc(var(--rowh) * 2),100% var(--rowh)}
.tt .day:last-child{border-right:0}
.tt .lunch{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--soft) 6px 12px);opacity:.9}
.ev{position:absolute;left:3px;right:3px;border-radius:5px;padding:3px 6px;font-size:12px;line-height:1.25;overflow:hidden;border:1px solid var(--eb);color:var(--ink);cursor:default}
.ev b{display:block;font-family:var(--f-mono);font-size:11.5px}
.ev .t{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.ev.tba{border-style:dashed;border-color:var(--bad)}
.c0{background:var(--e0)}.c1{background:var(--e1)}.c2{background:var(--e2)}.c3{background:var(--e3)}.c4{background:var(--e4)}.c5{background:var(--e5)}.c6{background:var(--e6)}.c7{background:var(--e7)}
/* dialog */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--panel);color:var(--ink);width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,20,14,.45)}
dialog form{display:grid;gap:12px;padding:18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font:600 12px var(--f-body);color:var(--muted);letter-spacing:.03em}
.field small{color:var(--muted);font-size:12px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px}
.checks label{display:flex;gap:6px;align-items:flex-start;font-size:13.5px}
.days label{display:inline-flex;gap:4px;align-items:center;margin-right:10px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100vw - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.printgrid{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px}
@media (max-width:820px){.printgrid{grid-template-columns:1fr}}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
@media (max-width:520px){.two{grid-template-columns:1fr}.brand h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ===================== ENGINE (pure functions) ===================== */
const Engine = (() => {
  const DAYS = ['Mon','Tue','Wed','Thu','Fri'];
  /* COTED organizational structure (v6): college committees, their chairs and composition. */
  const COMMITTEES = [
    {key:'fsti', name:'Field Study and Teaching Internship', units:21, reportsTo:'assocDean', regular:2, pt:1, jc:2, leave:'B', ptRole:'Assist regular college supervisors in orientation and portfolio checking'},
    {key:'qa', name:'Quality Assurance and Accreditation', units:12, reportsTo:'assocDean', regular:2, pt:1, jc:2, leave:'B', approval:true, ptRole:'Members of area task forces for gathering and organizing exhibits'},
    {key:'legt', name:'Licensure Examination and Graduate Tracer', units:15, reportsTo:'assocDean', regular:2, pt:2, jc:2, leave:'B', approval:true, ptRole:'LET reviewers; item writers for mock examinations; tracer survey enumerators'},
    {key:'rpim', name:'Research, Publications and Instructional Materials', units:15, reportsTo:'dean', regular:2, pt:0, jc:2, leave:'B', ptRole:'Secretariat of research colloquia; co-authors of research and instructional materials'},
    {key:'ep', name:'Extension and Production', units:15, reportsTo:'dean', regular:2, pt:1, jc:2, leave:'B', ptRole:'Implementers and resource persons in extension activities'},
    {key:'lic', name:'Linkages, Internationalization and Communications', units:15, reportsTo:'dean', regular:2, pt:1, jc:2, leave:'B', approval:true, ptRole:'Photo and video documentation, news writing, social media drafts'},
    {key:'fdgad', name:'Faculty Development and GAD', units:15, reportsTo:'dean', regular:2, pt:0, jc:2, leave:'B', approval:true, ptRole:'GAD advocacy activities and training logistics'},
    {key:'sasc', name:'Student Affairs, Sports and Culture', units:12, reportsTo:'dean', regular:2, pt:1, jc:2, leave:'B', ptRole:'Co-advisers of student organizations; sports and cultural event committees'},
    {key:'bpf', name:'Budget, Property and Facilities', units:18, reportsTo:'secretary', regular:2, pt:0, jc:2, leave:'A', approval:true, noPT:true, ptRole:'DRRM tasks only (marshals, housekeeping monitors); not members'}
  ].map(c => ({...c, chair:`Chairperson, College Committee on ${c.name}`, member:`Member, Committee on ${c.name}`}));
  const PC = 'Program Chairperson', DEAN = 'Dean', ASSOC = 'Associate Dean for Academic Affairs and Quality Assurance', SEC = 'College Secretary and Head of Administrative Services';
  const DESIG = [
    {name:DEAN, units:6}, {name:ASSOC, units:12}, {name:SEC, units:15}, {name:PC, units:16},
    ...COMMITTEES.map(c => ({name:c.chair, units:c.units})),
    {name:'Vice President', units:3}, {name:'Faculty Regent', units:15}, {name:'Approved research/extension project', units:18}];
  const HEADSHIPS = [DEAN, ASSOC, SEC, PC, ...COMMITTEES.map(c => c.chair)];
  /* Older designation names, replaced by the v6 structure. */
  const LEGACY = {'Program Chair':PC, 'Field Study Coordinator':COMMITTEES[0].chair, 'QA / Accreditation Coordinator':COMMITTEES[1].chair, 'LET Review Coordinator':COMMITTEES[2].chair,
    'Research Coordinator':COMMITTEES[3].chair, 'Extension Coordinator':COMMITTEES[4].chair, 'Student Affairs Coordinator':COMMITTEES[7].chair, 'Property and Supply Coordinator':COMMITTEES[8].chair, 'Facilities Coordinator':COMMITTEES[8].chair,
    'College Secretary':SEC, 'Research/Extension Coordinator':null, 'Laboratory/AVR In-charge':null, 'Department Chair':null, 'Scholarship Coordinator':null};
  const FIELDS = [
    ['Elementary Education',1],['Early Childhood Education',1],['Special Needs Education',1],['Secondary Education',1],['Education (general / professional)',1],
    ['Educational Management',1],['Guidance and Counseling',1],['Reading / Literacy Education',1],['English Education',1],['Filipino Education',1],
    ['Mathematics Education',1],['Science Education',1],['Social Studies Education',1],['Values Education',1],['Physical Education',1],
    ['Technology and Livelihood Education',1],['Psychology',1],
    ['English / Linguistics',0],['Filipino',0],['Literature',0],['Mathematics',0],['Statistics',0],['Biology',0],['Chemistry',0],['Physics',0],
    ['General Science',0],['History / Social Sciences',0],['Philosophy',0],['Music / Arts',0],['Information Technology / Computer Science',0],['Economics',0]
  ].map(([name,edu]) => ({name, edu:!!edu}));
  const LEVELS = {"Bachelor's":1, "Master's":2, "Doctorate":3};
  const DEF = { term:'1st Semester, AY 2026–2027', dayStart:'07:30', dayEnd:'17:30', slot:30, lunch:true, lunchStart:'12:00', lunchEnd:'13:00', lecPattern:'auto',
    load1:24, load2:21, load3:18, maxPreps:3, maxOverload:10, allowOverloadAuto:false,
    ptMax:18, ptMin:6, fullLoad:18, labHoursPerUnit:3, labCreditPerHour:0.75,
    lecMin:10, lecMax:35, labMin:10, labMax:25, outLecMax:9, outLabMax:5, thesisETU:0.05, thesisMax:5,
    desigMode:'teach', designations:DESIG, proximity:'normal', universityName:'CENTRAL PHILIPPINES STATE UNIVERSITY', universityAddress:'Kabankalan City, Negros Occidental', qaName:'', qaTitle:'Director, Quality Assurance', vpaaName:'', vpaaTitle:'Vice President for Academic Affairs', consultHours:10, wlCode:'CPSU-F-VPAA-03 REV', desigOverload:6, wlDate:'08/16/2022', wStrategic:0, wCore:90, wSupport:10, ratingPeriod:'2026-2', termMonths:'Aug,Sep,Oct,Nov,Dec', reqCatalog:'', maxContinuous:6, accGradPct:50, accFtProfPct:60, accMaxPreps:4, collegeName:'College of Teacher Education', roomFeatures:['Projector','TV / Smart TV','Air-conditioned','Sound system','Computers','Internet','Science equipment','Sink / water','Musical instruments','Open space / gym'], strict:true, mastersRule:'warn', fields:FIELDS };
  const NUMK = ['desigOverload','maxContinuous','accGradPct','accFtProfPct','accMaxPreps','slot','load1','load2','load3','maxPreps','maxOverload','ptMax','ptMin','fullLoad','labHoursPerUnit','labCreditPerHour','lecMin','lecMax','labMin','labMax','outLecMax','outLabMax','thesisETU','thesisMax'];
  const num = (v,d) => (v===''||v==null||isNaN(+v)) ? d : +v;
  const toMin = t => { const [h,m] = String(t||'0:0').split(':').map(Number); return (h||0)*60+(m||0); };
  const r2 = x => Math.round(x*100)/100;
  function cfg(S){
    const st = {...DEF, ...(S.settings||{})};
    NUMK.forEach(k => st[k] = num(st[k], DEF[k]));
    if (!Array.isArray(st.designations)) st.designations = DESIG;
    else st.designations = st.designations.filter(d => !(d.name in LEGACY)).concat(DESIG.filter(d => !st.designations.some(x => x.name === d.name)));
    if (!Array.isArray(st.fields) || !st.fields.length) st.fields = FIELDS;
    if (!Array.isArray(st.roomFeatures)) st.roomFeatures = DEF.roomFeatures;
    st.strict = st.strict !== false;
    st.start = toMin(st.dayStart); st.end = toMin(st.dayEnd);
    st.n = Math.max(1, Math.ceil((st.end-st.start)/st.slot));
    st.ls = st.lunch ? toMin(st.lunchStart) : -1; st.le = st.lunch ? toMin(st.lunchEnd) : -1;
    return st;
  }
  const status = f => (!f || !f.status || f.status==='Full-time') ? 'Permanent' : f.status;
  const isPT = f => status(f) === 'Part-time';
  const courseUnits = c => num(c.lec,0) + num(c.lab,0);              // units the student earns
  const labGroups = (c, st) => num(c.course.lab,0) > 0 ? Math.max(1, Math.ceil(num(c.sec.students,0) / st.labMax)) : 1;
  const teachLoad = (c, st) => num(c.course.lec,0) + labGroups(c,st) * num(c.course.lab,0) * st.labHoursPerUnit * st.labCreditPerHour;
  const contactHrs = (c, st) => num(c.course.lec,0) + labGroups(c,st) * num(c.course.lab,0) * st.labHoursPerUnit;
  const byName = (a,b) => String(a.name||a.code||'').localeCompare(String(b.name||b.code||''), undefined, {numeric:true});
  function classList(S){
    const out = [];
    Object.values(S.sections||{}).sort(byName).forEach(sec => (sec.courses||[]).forEach(cid => {
      const course = S.courses[cid]; if (course) out.push({id: sec.id+'~'+cid, sec, course});
    }));
    return out;
  }
  const isProfEd = course => course.category === 'Professional Education';
  const listed = (f,course) => !(f.canTeach||[]).length || f.canTeach.includes(course.id);
  const needsLicense = course => course.category === 'Professional Education' || course.category === 'Field Study / Teaching Internship';
  /* Educational qualifications: [{level, field, program, status}] — older records with a single "degree" are read as one degree of unknown field. */
  function degreesOf(f){
    if (Array.isArray(f.degrees)) return f.degrees.filter(d => d && LEVELS[d.level]);
    return f.degree && LEVELS[f.degree] ? [{level:f.degree, field:'', program:'', status:'Completed'}] : [];
  }
  /* Qualification to teach a subject: CMO 74–80, s. 2017 (Sec. 14) + CPSU Faculty Manual (master's in area of specialization). */
  function qualify(f, course, st){
    const degs = degreesOf(f), done = degs.filter(d => d.status !== 'With units');
    const eduNames = new Set(st.fields.filter(x => x.edu).map(x => x.name));

    return head + `<tr>
      <td><span class="mono">${esc(c.course.code)}</span><div class="small muted">${esc(c.course.title||'')}</div></td>
      <td class="r num">${E.r2(E.teachLoad(c,st))}<div class="small muted">${E.num(c.course.lec,0)} lec${E.num(c.course.lab,0)?` + ${c.course.lab} lab${E.labGroups(c,st)>1?` × ${E.labGroups(c,st)} groups`:''}`:''}</div></td>
      <td><select data-assign="${c.id}" ${ro} aria-label="Teacher for ${esc(c.sec.name)} ${esc(c.course.code)}"><option value="">— No teacher —</option>${opts.map(o => `<option value="${o.f.id}" ${o.f.id===fid?'selected':''} ${o.dis?'disabled':''}>${esc(o.txt)}</option>`).join('')}</select></td>
      <td class="small">${sch || '<span class="muted">Not scheduled</span>'}</td>
      <td>${!fid ? '<span class="pill p-bad">No teacher</span>' : (() => { const v = E.qualify(S.faculty[fid], c.course, st).verdict; return v==='not' ? '<span class="pill p-bad">Not qualified</span>' : v==='conditional' ? '<span class="pill p-warn">Conditional</span>' : '<span class="pill p-ok">Qualified</span>'; })()}</td></tr>`;
  }).join('');
  const open = cl.filter(c => !(assign[c.id] && S.faculty[assign[c.id]])).length;
  return `<div class="stack">
  <div class="panel stack">
    <div class="row between"><div><h2>Subject loading</h2><div class="small muted">${cl.length} classes · ${open} without a teacher. Teachers show ✓ qualified, ! conditional, ✕ not qualified, then current load / regular load and preparations.${st.strict?' Strict compliance is on: rule-breaking assignments are refused.':''} Lab hours count ${st.labCreditPerHour} unit each.</div></div></div>
    <div class="row">
      <button class="btn primary" data-act="autoload" data-perm="loadClasses" ${ro}>Auto-load empty classes</button>
      <button class="btn danger" data-act="autoload-reset" data-perm="loadClasses" ${ro}>Clear and reload all</button>
      <button class="btn" data-act="gen-keep" data-perm="updateSchedule" ${ro}>Update schedule</button>
      <button class="btn" data-act="gen-new" data-perm="rebuildSchedule" ${ro}>Rebuild schedule from scratch</button>
    </div>
    <div class="small muted">Auto-load gives permanent faculty priority, fills up to each regular load${st.allowOverloadAuto?', then overload for Very Satisfactory-rated faculty':''}, keeps everyone within ${st.maxPreps} preparations, and gives Professional Education subjects only to BLEPT-licensed faculty. <b>Update schedule</b> keeps existing time slots and places only new or changed classes. <b>Rebuild</b> re-plans every slot.</div>
  </div>
  <div class="row">
    <select id="fSec" aria-label="Section filter"><option value="">All sections</option>${sorted('sections').map(s => `<option value="${s.id}" ${ui.loadSec===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
    <div class="seg" role="group" aria-label="Show"><button aria-pressed="${ui.loadFilter==='all'}" data-lf="all">All classes</button><button aria-pressed="${ui.loadFilter==='open'}" data-lf="open">No teacher</button></div>
  </div>
  <div class="tablebox"><table><thead><tr><th>Subject</th><th class="r">Units</th><th>Teacher</th><th>Schedule</th><th>Status</th></tr></thead>
  <tbody>${rowsHtml || `<tr><td colspan="5" class="empty">No classes yet. Add subjects to each section on the Sections tab.</td></tr>`}</tbody></table></div>
  </div>`;
}

/* ---------- Timetables ---------- */
function timetables(){
  const st = E.cfg(S), assign = S.schedule.assign || {};
  const lists = {Teacher: sorted('faculty'), Section: sorted('sections'), Room: sorted('rooms')};
  const list = lists[ui.ttMode];
  if (!list.find(x => x.id === ui.ttId)) ui.ttId = (ui.ttMode === 'Teacher' && myAccess().fid && S.faculty[myAccess().fid]) ? myAccess().fid : list[0] ? list[0].id : '';
  const meets = S.schedule.meet.filter(m => {
    const [sec] = m.c.split('~');
    return ui.ttMode==='Teacher' ? assign[m.c]===ui.ttId : ui.ttMode==='Section' ? sec===ui.ttId : m.r===ui.ttId;
  });
  const rowH = 26, H = st.n*rowH;
  const courseIds = Object.keys(S.courses).sort();
  const colorOf = cid => 'c' + (courseIds.indexOf(cid) % 8 + 8) % 8;
  const tlabels = []; for (let m = st.start; m + st.slot <= st.end; m += st.slot) tlabels.push(m);
  const ev = m => {
    const [sid, cid] = m.c.split('~'), c = S.courses[cid] || {}, sec = S.sections[sid] || {}, f = S.faculty[assign[m.c]];
    const top = (m.s - st.start)/st.slot*rowH, h = (m.e - m.s)/st.slot*rowH - 2;
    const line2 = ui.ttMode==='Teacher' ? `${sec.name||''} · ${(S.rooms[m.r]||{}).name||''}` : ui.ttMode==='Section' ? `${f?f.name:'TBA – no teacher'} · ${(S.rooms[m.r]||{}).name||''}` : `${sec.name||''} · ${f?f.name:'TBA'}`;
    return `<div class="ev ${colorOf(cid)} ${f?'':'tba'}" data-mi="${S.schedule.meet.indexOf(m)}" role="button" tabindex="0" style="top:${top+1}px;height:${h}px;cursor:pointer" title="Tap for room suggestions
"${esc(c.code)} ${esc(c.title||'')}\n${fmt(m.s)}–${fmt(m.e)}\n${esc(line2)}">
      <b>${esc(c.code||'?')}${m.k==='LAB'?' · LAB'+(m.g!=null&&groupsOf(m.c)>1?' G'+(m.g+1):''):''}</b><div class="t">${fmtS(m.s)}–${fmtS(m.e)}</div><div>${esc(line2)}</div></div>`;
  };
  const lunch = st.lunch ? `<div class="lunch" style="top:${(st.ls-st.start)/st.slot*rowH}px;height:${(st.le-st.ls)/st.slot*rowH}px" title="Lunch break"></div>` : '';
  const grid = `<div class="ttbox"><div class="tt" style="--rowh:${rowH}px">
    <div class="hd"></div>${DAYS.map(d => `<div class="hd">${d}</div>`).join('')}
    <div class="times" style="height:${H}px">${tlabels.map(m => `<span class="${(m-st.start)%60===0?'hr':''}" style="top:${(m-st.start)/st.slot*rowH}px;height:${rowH}px">${fmtS(m)}–${fmtS(m+st.slot)}</span>`).join('')}</div>
    ${DAYS.map((_,d) => `<div class="day" style="height:${H}px">${lunch}${meets.filter(m => m.d===d).map(ev).join('')}</div>`).join('')}
  </div></div>`;
  // summary
  let summary = '';
  const ent = list.find(x => x.id === ui.ttId);
  if (ent && ui.ttMode==='Teacher'){
    const A = E.analysis(S), r = A.rows.find(x => x.f.id === ent.id);
    const wk = E.walks(S, m => assign[m.c]===ent.id);
    if (r) summary = `<div class="row small"><span>${wk.bld} building change${wk.bld===1?'':'s'}, ${wk.flr} floor change${wk.flr===1?'':'s'} between back-to-back classes</span>·<span>${esc(E.status(ent))}${r.desig?' · '+esc(r.desig):''}</span>·<span class="num">${r.units} units${r.etu?` (incl. ${r.etu} ETU)`:''}, regular ${r.reg}, max ${r.max}</span>·<span class="num">${r.hours} contact hrs/week</span>·<span>${r.preps} preparation${r.preps===1?'':'s'}</span>${statusPill(r.status)}</div>`;
  } else if (ent && ui.ttMode==='Section'){
    const units = (ent.courses||[]).reduce((s,c) => s + (S.courses[c] ? E.courseUnits(S.courses[c]) : 0), 0);
    const wk = E.walks(S, m => m.c.split('~')[0]===ent.id);
    summary = `<div class="row small"><span>${wk.bld} building change${wk.bld===1?'':'s'}, ${wk.flr} floor change${wk.flr===1?'':'s'} a week</span>·<span>${esc(ent.program||'')} ${ent.yearLevel?('Year '+esc(ent.yearLevel)):''}</span>·<span class="num">${E.num(ent.students,0)} students</span>·<span class="num">${(ent.courses||[]).length} subjects, ${units} units</span></div>`;
  } else if (ent){
    const used = meets.reduce((s,m) => s + m.e - m.s, 0)/60, avail = (st.end - st.start - (st.lunch ? st.le - st.ls : 0))/60*5;
    summary = `<div class="row small"><span>${esc(ent.type||'')}</span>·<span class="num">capacity ${E.num(ent.capacity,0)}</span>·<span class="num">used ${E.r2(used)} of ${E.r2(avail)} hrs/week (${Math.round(used/avail*100)||0}%)</span></div>`;
  }
  const tableRows = meets.slice().sort((a,b)=>a.d-b.d||a.s-b.s).map(m => {
    const [sid,cid] = m.c.split('~'), f = S.faculty[assign[m.c]];
    return `<tr><td>${DAYS[m.d]}</td><td class="num">${fmt(m.s)}–${fmt(m.e)}</td><td class="mono">${esc((S.courses[cid]||{}).code)}${m.k==='LAB'?' (lab)':''}</td><td>${esc((S.sections[sid]||{}).name)}</td><td>${f?esc(f.name):'<span class="pill p-bad">No teacher</span>'}</td><td>${esc((S.rooms[m.r]||{}).name)}</td></tr>`;
  }).join('');
  return `<div class="stack">
    <div class="row between">
      <div class="seg" role="group" aria-label="Timetable type">${['Teacher','Section','Room'].map(k => `<button aria-pressed="${ui.ttMode===k}" data-tt="${k}">${k==='Section'?'Students (Section)':k}</button>`).join('')}</div>
      <div class="row">${dl ? `<button class="btn" data-act="csv-grid">Download this as 30-minute grid (CSV)</button><button class="btn" data-act="csv-tt">Download this as list (CSV)</button><button class="btn" data-act="csv-all">Download all schedules (CSV)</button>` : ''}</div>
    </div>
    <div class="row"><select id="ttSel" aria-label="Choose ${ui.ttMode}">${list.map(x => `<option value="${x.id}" ${x.id===ui.ttId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
      ${!S.schedule.at ? '<span class="pill p-warn">No schedule yet. Go to Loading and generate one.</span>' : ''}</div>
    ${summary}
    ${list.length && meets.length ? '<div class="small muted">Tap a class to see suggested rooms and move it.</div>' : ''}
    ${list.length ? grid : `<div class="panel empty">Add ${ui.ttMode==='Teacher'?'faculty':ui.ttMode==='Section'?'sections':'rooms'} first.</div>`}
    ${meets.length ? `<div class="tablebox"><table><thead><tr><th>Day</th><th>Time</th><th>Subject</th><th>Section</th><th>Teacher</th><th>Room</th></tr></thead><tbody>${tableRows}</tbody></table></div>` : ''}
  </div>`;
}

/* ---------- Load analysis ---------- */
function analysis(){
  const A = E.analysis(S), st = A.st;
  const counts = {}; A.rows.forEach(r => counts[r.status] = (counts[r.status]||0)+1);
  const rows = A.rows.map(r => `<tr>
    <td><b>${esc(r.f.name)}</b><div class="small muted">${esc(E.status(r.f))}${r.desig?' · '+esc(r.desig):''}${r.f.vsRating?' · VS rating':''}</div></td>
    <td class="r num">${r.reg}</td><td class="r num">${r.max}</td><td class="r num">${r.teach}</td><td class="r num">${r.etu||'—'}</td><td class="r num"><b>${r.units}</b></td>
    <td>${loadBar(r.units, r.reg, r.max)}</td>
    <td class="r num" style="color:${r.diff<0?'var(--info)':r.diff>0?'var(--warn)':'var(--ok)'}">${r.diff>0?'+':''}${r.diff}</td>
    <td class="r num">${r.classes.length}</td><td class="r num" style="${r.preps>st.maxPreps?'color:var(--bad);font-weight:700':''}">${r.preps}</td><td class="r num">${r.hours}</td><td>${statusPill(r.status)}</td></tr>`).join('');
  const open = A.open.map(o => `<tr><td>${esc(o.c.sec.name)}</td><td class="mono">${esc(o.c.course.code)}</td><td>${esc(o.c.course.title||'')}</td><td class="r num">${o.cr}</td><td class="small">${esc(o.why)}</td></tr>`).join('');
  return `<div class="stack">
  <div class="kpis">
    <div class="kpi"><b class="num">${A.required}</b><span>Units to teach this term</span></div>
    <div class="kpi"><b class="num">${A.assigned}</b><span>Units loaded to faculty</span></div>
    <div class="kpi"><b class="num" style="color:${A.U?'var(--bad)':'var(--ok)'}">${A.U}</b><span>Units without a teacher (${A.open.length} classes)</span></div>
    <div class="kpi"><b class="num">${A.fte}</b><span>FTE needed for open units (${st.fullLoad} units = 1 full load)</span></div>
  </div>
  <div class="panel stack">
    <div class="row between"><h2>Hiring recommendation</h2>${dl?'<button class="btn" data-act="csv-load">Download load report (CSV)</button>':''}</div>
    <div class="callout ${A.rec.verdict==='none'?'ok':A.rec.verdict==='hire'?'bad':''}"><ul>${A.rec.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>
    ${A.needSubjects.length ? `<div><span class="eyebrow">Subjects the new hire should handle</span><div class="row" style="margin-top:6px">${A.needSubjects.map(n => `<span class="pill p-gold">${esc(n.course.code)} × ${n.n} (${n.units} u)</span>`).join('')}</div>
      <div class="small muted" style="margin-top:6px">Required qualification of the new hire: ${esc([...new Set(A.needSubjects.flatMap(n => n.fields))].join(', ') || 'Education or allied degree')}${A.needSubjects.some(n => n.lic) ? '; BLEPT license (for Professional Education subjects)' : ''}; master’s degree in the area of specialization preferred (CPSU Faculty Manual).</div></div>` : ''}
    <div class="small muted">Rules used (CPSU Faculty Manual 2020): regular load ${st.load1} / ${st.load2} / ${st.load3} units for 1 / 2 / 3+ preparations, at most ${st.maxPreps} preparations; lab hours credited ${st.labCreditPerHour} unit each; overload up to ${st.maxOverload} hours only with a Very Satisfactory rating; designations ${st.desigMode==='teach'?'set the required teaching load':'add equivalent workload units'}. New hires are sized at ${st.fullLoad} units; a part-time hire needs at least ${st.ptMin} units. Change these on Settings.</div>
  </div>
  <div class="row small">${['Underload','Regular load','Overload','Over limit'].map(k => `${statusPill(k)} <span class="num">${counts[k]||0}</span>`).join(' &nbsp; ')}</div>
  <div class="tablebox"><table><thead><tr><th>Faculty</th><th class="r">Regular</th><th class="r">Max</th><th class="r">Teaching</th><th class="r">ETU</th><th class="r">Total</th><th>Load</th><th class="r">± Regular</th><th class="r">Classes</th><th class="r">Preps</th><th class="r">Hrs/wk</th><th>Status</th></tr></thead>
  <tbody>${rows || '<tr><td colspan="12" class="empty">Add faculty to see their loads.</td></tr>'}</tbody></table></div>
  <h3>Classes without a teacher</h3>
  <div class="tablebox"><table><thead><tr><th>Section</th><th>Code</th><th>Subject</th><th class="r">Units</th><th>Reason</th></tr></thead>
  <tbody>${open || '<tr><td colspan="5" class="empty">Every class has a teacher.</td></tr>'}</tbody></table></div>
  </div>`;
}

/* ---------- Qualifications & suggested load ---------- */
function qualifications(){
  const st = E.cfg(S), fac = sorted('faculty'), crs = sorted('courses');
  if (!fac.find(f => f.id === ui.qId)) ui.qId = fac[0] ? fac[0].id : '';
  const f = S.faculty[ui.qId];
  const pill = v => v==='qualified' ? '<span class="pill p-ok">Qualified</span>' : v==='conditional' ? '<span class="pill p-warn">Conditional</span>' : '<span class="pill p-bad">Not qualified</span>';
  let detail = '<div class="panel empty">Add faculty first.</div>';
  if (f){
    const sg = E.suggest(S, f.id), degs = E.degreesOf(f);
    const sugRow = x => `<tr><td>${esc(x.c.sec.name)}</td><td class="mono">${esc(x.c.course.code)}</td><td>${esc(x.c.course.title||'')}</td><td class="r num">${x.cr}</td><td>${pill(x.q)}</td>
      <td class="r"><button class="link" data-act="assign-one" data-perm="loadClasses" data-cid="${x.c.id}" data-fid="${f.id}" ${ro}>Assign</button></td></tr>`;
    detail = `<div class="two">
      <div class="panel stack">
        <div class="row between"><h2>${esc(f.name)}</h2><span class="small muted">${esc(E.status(f))}</span></div>
        <div class="tablebox"><table><thead><tr><th>Degree</th><th>Field / major</th><th>Program</th><th>Status</th></tr></thead><tbody>
          ${degs.map(d => `<tr><td>${esc(d.level)}</td><td>${esc(d.field||'— not set —')}</td><td>${esc(d.program||'')}</td><td>${esc(d.status||'Completed')}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">No degrees entered. Edit this teacher on the Faculty tab.</td></tr>'}
        </tbody></table></div>
        <div class="row small">${f.licensed?'<span class="pill p-ok">BLEPT-licensed</span>':'<span class="pill p-mute">No BLEPT license</span>'} ${f.vsRating?'<span class="pill p-info">VS rating · overload allowed</span>':'<span class="pill p-mute">No VS rating · no overload</span>'}</div>
        <button class="link" data-edit="faculty:${f.id}" style="justify-self:start" ${ro}>Edit qualifications</button>
      </div>
      <div class="panel stack">
        <div class="row between"><h2>Suggested load</h2><span class="small muted num">Now ${sg.before} → with suggestions ${sg.after} of ${sg.reg} units</span></div>
        ${sg.fits.length ? `<div class="tablebox"><table><thead><tr><th>Section</th><th>Code</th><th>Subject</th><th class="r">Units</th><th>Qualification</th><th></th></tr></thead><tbody>${sg.fits.map(sugRow).join('')}</tbody></table></div>
          <button class="btn primary" data-act="assign-sugg" data-perm="loadClasses" data-fid="${f.id}" style="justify-self:start" ${ro}>Assign all ${sg.fits.length} suggested</button>`
          : `<div class="small muted">No open class fits. ${sg.before >= sg.reg ? 'The regular load is already full.' : `Every open class this teacher qualifies for would go past the regular load or the ${st.maxPreps}-preparation limit (a new subject can also lower the regular load, e.g. to ${st.load3} units at 3 preparations).`}</div>`}
        ${sg.overload.length ? `<span class="eyebrow">Possible as overload (VS rating)</span><div class="tablebox"><table><tbody>${sg.overload.map(sugRow).join('')}</tbody></table></div>` : ''}
        <div class="small muted">Suggestions use only open classes the teacher is qualified for, keep within ${st.maxPreps} preparations, and stop at the regular load.</div>
      </div></div>
      <div class="panel stack"><h3>Qualification by subject</h3>
      <div class="tablebox"><table><thead><tr><th>Code</th><th>Subject</th><th>Category</th><th>Verdict</th><th>Basis</th></tr></thead><tbody>
      ${sg.subjects.slice().sort((a,b) => ({qualified:0,conditional:1,not:2})[a.verdict] - ({qualified:0,conditional:1,not:2})[b.verdict]).map(x => `<tr><td class="mono">${esc(x.course.code)}</td><td>${esc(x.course.title||'')}</td><td class="small">${esc(x.course.category||'')}</td><td>${pill(x.verdict)}</td><td class="small">${x.reasons.map(esc).join('<br>')}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  }
  const sym = v => v==='qualified' ? '<span style="color:var(--ok);font-weight:700" title="Qualified">✓</span>' : v==='conditional' ? '<span style="color:var(--warn);font-weight:700" title="Conditional">!</span>' : '<span style="color:var(--bad)" title="Not qualified">✕</span>';
  const matrix = fac.length && crs.length ? `<div class="tablebox"><table class="small"><thead><tr><th>Faculty</th>${crs.map(c => `<th title="${esc(c.title||'')}" style="text-align:center">${esc(c.code)}</th>`).join('')}<th class="r">Qualified</th></tr></thead><tbody>
    ${fac.map(f2 => { const vs = crs.map(c => E.qualify(f2, c, st).verdict);
      return `<tr><td style="white-space:nowrap"><button class="link" data-qf="${f2.id}" style="padding:0">${esc(f2.name)}</button></td>${vs.map(v => `<td style="text-align:center">${sym(v)}</td>`).join('')}<td class="r num">${vs.filter(v => v!=='not').length}</td></tr>`; }).join('')}
    <tr><td><b>Qualified teachers</b></td>${crs.map(c => { const n = fac.filter(f2 => E.qualify(f2, c, st).verdict !== 'not').length; return `<td class="num" style="text-align:center;${n?'':'color:var(--bad);font-weight:700'}">${n}</td>`; }).join('')}<td></td></tr>
    </tbody></table></div>` : '';
  return `<div class="stack">
    <div><h2>Qualifications</h2><div class="small muted">A teacher is qualified for a subject when their completed degree is in an accepted field for it (CMO 74–80, s. 2017, Sec. 14). Professional Education and Field Study / Teaching Internship also need a BLEPT license and an Education or allied degree. A bachelor’s-level match is ${st.mastersRule==='block'?'<b>not qualified</b>':'<b>conditional</b>'} because the CPSU Faculty Manual requires a master’s in the area of specialization.</div></div>
    <div class="row"><select id="qSel" aria-label="Choose faculty">${fac.map(x => `<option value="${x.id}" ${x.id===ui.qId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
    ${detail}
    <h3>Qualification matrix</h3><div class="small muted">✓ qualified · ! conditional · ✕ not qualified. A subject with 0 qualified teachers needs a hire or a faculty development plan.</div>
    ${matrix}
  </div>`;
}

/* ---------- RQAT faculty summary ---------- */
function rqatView(){
  const st = E.cfg(S), sc = E.scopes(S);
  const opts = ui.rqType === 'program' ? sc.programs : ui.rqType === 'department' ? sc.departments : [];
  if (ui.rqType !== 'college' && !opts.includes(ui.rqVal)) ui.rqVal = opts[0] || '';
  const R = E.rqat(S, {type:ui.rqType, value:ui.rqVal});
  const scopeName = ui.rqType === 'college' ? (st.collegeName || 'College') : ui.rqType === 'department' ? ui.rqVal : `${ui.rqVal} program`;
  const deg = r => r.top ? `${esc(r.top.level)}${r.top.field ? ' · ' + esc(r.top.field) : ''}${r.top.program ? `<div class="small muted">${esc(r.top.program)}</div>` : ''}` : '<span class="pill p-bad">None entered</span>';
  const vp = v => v==='qualified' ? '<span class="pill p-ok">Aligned</span>' : v==='conditional' ? '<span class="pill p-warn">Conditional</span>' : v==='not' ? '<span class="pill p-bad">Not aligned</span>' : '<span class="muted">—</span>';
  const sumHead = `<tr><th>Classification</th><th class="r">Faculty</th><th class="r">Full-time</th><th class="r">Part-time</th><th class="r">Doctorate</th><th class="r">Master’s</th><th class="r">Bachelor’s</th><th class="r">With MA units</th><th class="r">BLEPT</th><th class="r">Aligned</th><th class="r">% full-time</th></tr>`;

  const roomRows = R.roomUse.map(x => `<tr><td>${esc(x.r.name)}</td><td>${esc(x.r.building||'')}${x.r.floor!=null&&x.r.floor!==''?' · '+esc(x.r.floor):''}</td><td>${esc(x.r.type||'')}</td><td class="r num">${E.num(x.r.capacity,0)}</td><td class="r num">${x.maxN||'—'}</td><td class="small">${(x.r.features||[]).map(esc).join(', ')||'—'}</td><td class="r num">${x.classes}</td><td class="r num">${x.hrs}</td><td class="r num">${x.pct}%</td></tr>`).join('');
  const sizeRows = R.secs.sort(E.byName).map(s => { const n = E.num(s.students,0), hasLab = (s.courses||[]).some(id => S.courses[id] && E.num(S.courses[id].lab,0)>0);
    return `<tr><td>${esc(s.name)}</td><td>${esc(s.program||'')}</td><td class="r num">${n}</td><td>${n > st.lecMax ? (s.sizeException ? '<span class="pill p-warn">Exception</span>' : '<span class="pill p-bad">Over</span>') : n < st.lecMin ? '<span class="pill p-warn">Small</span>' : '<span class="pill p-ok">Within</span>'}</td><td class="r num">${hasLab ? Math.ceil(n/st.labMax) : '—'}</td><td class="r num">${hasLab ? Math.ceil(n/Math.ceil(n/st.labMax)) : '—'}</td></tr>`; }).join('');

    <div class="panel stack"><h3>Exhibit: ${EXH.sizes}</h3><div class="tablebox"><table><thead><tr><th>Section</th><th>Program</th><th class="r">Students</th><th>Lecture size</th><th class="r">Lab groups</th><th class="r">Lab group size</th></tr></thead><tbody>${sizeRows}</tbody></table></div></div>
    <div class="small muted">Targets (graduate-degree share, full-time share of professional subjects, maximum preparations, continuous hours) are set in Settings → Accreditation targets. Check them against the instrument for your program and level, since AACCUP instruments differ by discipline.</div>
  </div>`;
}
const EXH = {rank:'Faculty by rank and specialization', quals:'Faculty academic qualifications', load:'Faculty teaching load', rooms:'Classroom and laboratory utilization', sizes:'Class size by section'};

/* ---------- Faculty requirements and SPMS (IPCR/OPCR) ---------- */
const REQ_DEFAULT = [
  'Personal Data Sheet (CSC Form 212) | once | all', 'Transcript of Records | once | all', 'Diploma(s) | once | all', 'PRC ID / professional license | once | all',
  'Appointment papers | once | permanent', 'Contract of service | term | part-time', 'Service record | once | full-time', 'Training certificates (last 3 years) | once | all',
  'Designation / special order | once | designee', 'Faculty workload (signed) | term | all', 'IPCR targets | term | all', 'IPCR accomplishment | term | all',
  'Student evaluation of teaching result | term | all', 'OPCR targets | term | designee', 'OPCR accomplishment | term | designee', 'Monthly accomplishment report | monthly | designee',
  'Syllabus (OBE) | subject | all', 'Table of specifications – midterm | subject | all', 'Table of specifications – final | subject | all', 'Midterm examination | subject | all', 'Final examination | subject | all',
  'Class record | class | all', 'Grade sheet – midterm | class | all', 'Grade sheet – final | class | all'].join('\n');
const FREQ_LABEL = {once:'Personnel file (once)', term:'This term', subject:'Per subject taught', class:'Per class', monthly:'Monthly'};
const reqCatalog = () => String(E.cfg(S).reqCatalog || REQ_DEFAULT).split('\n').map(l => l.split('|').map(x => x.trim())).filter(x => x[0])
  .map(([name, freq, applies], i) => ({id: name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40), name, freq: FREQ_LABEL[freq] ? freq : 'term', applies: applies || 'all'}));
const termKey = () => String(E.cfg(S).term || 'term').replace(/[^A-Za-z0-9]+/g,'-').slice(0,40);
const isDesignee = f => (f.designations||[]).length > 0;
function reqApplies(r, f){ const a = r.applies.toLowerCase(), st = E.status(f);
  return a === 'all' || (a === 'full-time' && !E.isPT(f)) || (a === 'part-time' && E.isPT(f)) || (a === 'permanent' && st === 'Permanent') || (a === 'temporary' && st === 'Temporary') || (a === 'designee' && isDesignee(f)) || (f.designations||[]).map(x => x.toLowerCase()).includes(a); }
function reqItems(fid){
  const f = S.faculty[fid]; if (!f) return [];
  const tk = termKey(), assign = S.schedule.assign || {}, cl = E.classList(S).filter(c => assign[c.id] === fid);
  const subj = [...new Map(cl.map(c => [c.course.id, c.course])).values()];
  const months = String(E.cfg(S).termMonths || 'Aug,Sep,Oct,Nov,Dec').split(',').map(x => x.trim()).filter(Boolean);
  const out = [];
  reqCatalog().filter(r => reqApplies(r, f)).forEach(r => {
    if (r.freq === 'once') out.push({key:r.id, r, label:r.name});
    else if (r.freq === 'term') out.push({key:`${r.id}@${tk}`, r, label:r.name});
    else if (r.freq === 'subject') subj.forEach(c => out.push({key:`${r.id}@${tk}@${c.id}`, r, label:`${r.name} – ${c.code}`}));
    else if (r.freq === 'class') cl.forEach(c => out.push({key:`${r.id}@${tk}@${c.id}`, r, label:`${r.name} – ${c.sec.name} · ${c.course.code}`}));
    else if (r.freq === 'monthly') months.forEach(m => out.push({key:`${r.id}@${tk}@${m}`, r, label:`${r.name} – ${m}`}));
  });
  const doc = (S.reqs[fid] && S.reqs[fid].items) || {};
  return out.map(x => ({...x, ...(doc[x.key] || {}), s: (doc[x.key] || {}).s || ''}));
}
function reqStats(fid){ const it = reqItems(fid).filter(x => x.s !== 'na'); const v = it.filter(x => x.s === 'verified').length, sub = it.filter(x => x.s === 'submitted').length, ret = it.filter(x => x.s === 'returned').length;
  return {n: it.length, v, sub, ret, pend: it.length - v - sub - ret, pct: it.length ? Math.round(v / it.length * 100) : 0}; }
const REQ_STATUS = {'':['Pending','p-mute'], submitted:['Submitted','p-info'], verified:['Verified','p-ok'], returned:['Returned','p-bad'], na:['Not applicable','p-mute']};

/* SPMS: Q, E, T rated 1–5; row = average of entered; final = weighted by function (CSC SPMS adjectival scale). */
const ADJ = [[4.5,'Outstanding'],[3.5,'Very Satisfactory'],[2.5,'Satisfactory'],[1.5,'Unsatisfactory'],[1,'Poor']];
const adjOf = v => v == null ? '—' : (ADJ.find(([m]) => v >= m - 1e-9) || [0,'Poor'])[1];
const FUNCS = [['strategic','Strategic priorities'],['core','Core functions'],['support','Support functions']];
function ipcrTemplate(kind){
  if (kind === 'OPCR') return [['strategic','Office targets aligned with the university’s strategic plan'],['core','Programs and services of the office delivered as planned'],['core','Reports submitted to the Dean/VPAA (monthly, terminal)'],['core','Faculty requirements of the unit verified on time'],['support','Office meetings and records maintained']].map(([f,out]) => ({f, out, q:'', e:'', t:''}));
  return [['core','Classes handled as scheduled (Instruction)'],['core','Syllabi, TOS and examinations prepared and submitted (Instruction)'],['core','Grades submitted on time (Instruction)'],['core','Student evaluation of teaching (Instruction)'],['core','Research output (proposal, paper, presentation)'],['core','Extension activity conducted'],['support','Attendance to college and university activities'],['support','Submission of required reports']].map(([f,out]) => ({f, out, q:'', e:'', t:''}));
}
function periodKey(){ return String(E.cfg(S).ratingPeriod || '2026-2'); }
function periodLabel(k){ const [y,h] = String(k).split('-'); return `${h === '1' ? 'Jan–Jun' : 'Jul–Dec'} ${y}`; }
function prevPeriod(k, n=1){ let [y,h] = String(k).split('-').map(Number); for (let i=0;i<n;i++){ if (h === 2) h = 1; else { h = 2; y--; } } return `${y}-${h}`; }
function perfOf(fid, pk){ const d = S.perf[fid] && S.perf[fid].periods && S.perf[fid].periods[pk || periodKey()]; return d || null; }
function ratePerf(p){
  if (!p || !p.rows) return {final:null, byF:{}};
  const w = E.cfg(S), W = {strategic: E.num(w.wStrategic,0), core: E.num(w.wCore,90), support: E.num(w.wSupport,10)};
  const rowAvg = r => { const v = ['q','e','t'].map(k => r[k]).filter(x => x !== '' && x != null).map(Number); return v.length ? v.reduce((a,b) => a+b, 0)/v.length : null; };
  const byF = {}; FUNCS.forEach(([k]) => { const a = p.rows.filter(r => r.f === k).map(rowAvg).filter(x => x != null); byF[k] = a.length ? a.reduce((x,y) => x+y, 0)/a.length : null; });
  const used = FUNCS.filter(([k]) => byF[k] != null && W[k] > 0), sw = used.reduce((a,[k]) => a + W[k], 0);
  const final = sw ? used.reduce((a,[k]) => a + byF[k]*W[k], 0) / sw : null;
  return {final: final == null ? null : Math.round(final*1000)/1000, byF, rowAvg};
}
function vsEligible(fid){ const p1 = ratePerf(perfOf(fid, prevPeriod(periodKey(),1))).final, p2 = ratePerf(perfOf(fid, prevPeriod(periodKey(),2))).final;
  return {p1, p2, ok: p1 != null && p2 != null && p1 >= 3.5 && p2 >= 3.5}; }
const suggestFromPct = pct => pct >= 100 ? 5 : pct >= 90 ? 4 : pct >= 75 ? 3 : pct >= 50 ? 2 : 1;

/* Scope over faculty for chairs. */
function facInScope(fid){ const A = myAccess(), r = ROLES[A.role] || {}, f = S.faculty[fid] || {};
  if (!r.scope) return true; return r.scope === 'program' ? (f.homeProgram||'') === A.program : (f.department||'') === A.department; }
function guardTrack(col, fid, next, prev){
  const A = myAccess();
  if (col === 'reqs'){
    if (can('verifyRequirements') && canSupervise(fid)) return '';
    if (A.fid === fid){ const p = (prev && prev.items) || {}, n = next.items || {};
      const bad = Object.keys(n).filter(k => (n[k].s||'') !== ((p[k]||{}).s||'') && !['','submitted'].includes(n[k].s||'')); return bad.length ? 'Only your chair or dean can mark requirements verified, returned or not applicable.' : ''; }
    return `Your role (${roleLabel()}) cannot update this teacher’s requirements.`;
  }
  if (col === 'perf'){
    if (can('ratePerformance') && canSupervise(fid)) return '';
    if (A.fid === fid){ const pk = periodKey(), p0 = prev && prev.periods && prev.periods[pk], p1 = next.periods && next.periods[pk];
      if (p0 && ['rated','approved'].includes(p0.status)) return 'This rating is already final. Ask your rater to return it if a change is needed.';
      if (p1 && !['draft','submitted'].includes(p1.status)) return 'Only your rater can finalize the rating.'; return ''; }
    return `Your role (${roleLabel()}) cannot rate this teacher.`;
  }
  return '';
}
async function putTrack(col, fid, next){
  const err = guardTrack(col, fid, next, S[col][fid]); if (err){ toast(err); render(); return; }
  S[col][fid] = next; render();
  if (db) await q(col+'/'+fid, () => db.collection(col).doc(fid).set(clean(next))).catch(onWriteErr); else saveLocal();
}

/* ---------- Actions ---------- */
const armed = {};
function arm(btn, key, label){ if (armed[key]) { delete armed[key]; return true; }
  armed[key] = true; btn.classList.add('armed'); const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { delete armed[key]; if (btn.isConnected){ btn.classList.remove('armed'); btn.textContent = old; } }, 4000); return false; }

async function runGenerate(keep){
  if (!gate('generate the schedule')) return;
  const res = E.generate(S, {keep});
  S.schedule = {...S.schedule, meet:res.meet, unplaced:res.unplaced, at:new Date().toISOString()};
  await putDoc('schedule');
  const V = E.validate(S);
  toast(res.unplaced.length ? `Schedule saved. ${res.unplaced.length} class(es) could not be placed; see the Dashboard.` : `Schedule saved with ${V.issues.length ? V.issues.length+' conflicts' : 'no conflicts'}.`);
}
function csv(rows){ return rows.map(r => r.map(v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(',')).join('\r\n'); }
async function save(filename, data){ if (!dl) return; try { await dl.save({filename, data}); } catch(e){ if (e && e.code !== 'declined') toast('Download is not available here.'); } }
function scheduleRows(filter){
  const a = S.schedule.assign||{};
  return S.schedule.meet.filter(filter||(()=>true)).slice().sort((x,y)=>x.d-y.d||x.s-y.s).map(m => { const [sid,cid] = m.c.split('~'), c = S.courses[cid]||{}, f = S.faculty[a[m.c]];
    return [DAYS[m.d], fmt(m.s), fmt(m.e), c.code, c.title, m.k==='LAB'?'Laboratory'+(m.g!=null&&groupsOf(m.c)>1?' G'+(m.g+1):''):'Lecture', (S.sections[sid]||{}).name, f?f.name:'TBA (no teacher)', roleOf(f), (S.rooms[m.r]||{}).name]; });
}
const HDR = ['Day','Start','End','Code','Descriptive title','Type','Section','Teacher','Teacher role / designation','Room'];

document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.ag){ ui.agency = t.dataset.ag; render(); return; }
  if (t.dataset.reqsub){ const [fid, key] = t.dataset.reqsub.split('|'); const it = reqItems(fid).find(x => x.key === key); linkDialog(fid, key, it ? it.label : 'Requirement'); return; }
  if (t.dataset.reqset){ const [fid, key, st] = t.dataset.reqset.split('|'); setReq(fid, key, {s:st, at:new Date().toISOString()}); return; }
  if (t.dataset.pscope){ P_.scopeType = t.dataset.pscope; P_.scopeVal = ''; render(); return; }
  if (t.dataset.reqf){ ui.reqF = t.dataset.reqf; render(); return; }
  if (t.dataset.dash){ ui.dashF = t.dataset.dash; ui.tab = 'mydash'; render(); window.scrollTo({top:0}); return; }
  if (t.dataset.perff){ ui.perfF = t.dataset.perff; render(); return; }
  if (t.dataset.perfdel){ const i = +t.dataset.perfdel; setPerf(ui.perfF, p => p.rows.splice(i,1)); return; }
  if (t.dataset.accdel){ if (!arm(t, 'acc'+t.dataset.accdel, 'Confirm')) return; putAccess(t.dataset.accdel, null); return; }
  if (t.dataset.addpid){ const id = t.dataset.addpid; if (!ACCESS[id]) putAccess(id, {role:'', facultyId:'', program:'', department:''}); $('#accSearch') && ($('#accSearch').value = ''); return; }
  if (t.dataset.rq){ ui.rqType = t.dataset.rq; ui.rqVal = ''; render(); return; }
  if (t.dataset.qf){ ui.qId = t.dataset.qf; render(); window.scrollTo({top:0}); return; }
  if (t.dataset.go){ ui.tab = t.dataset.go; render(); window.scrollTo({top:0}); return; }
  if (t.dataset.tt){ ui.ttMode = t.dataset.tt; ui.ttId = ''; render(); return; }
  if (t.dataset.lf){ ui.loadFilter = t.dataset.lf; render(); return; }
  if (t.dataset.edit){ const [col,id] = t.dataset.edit.split(':'); ({faculty:facultyForm, courses:courseForm, sections:sectionForm, rooms:roomForm})[col]({...S[col][id]}); return; }
  if (t.dataset.del){ const [col,id] = t.dataset.del.split(':'); if (!arm(t, 'del'+id, 'Confirm')) return;
    delRec(col, id);
    if (col==='courses'){ // remove from sections and faculty lists
      Object.values(S.sections).filter(s => (s.courses||[]).includes(id)).forEach(s => putRec('sections', {...s, courses:s.courses.filter(x => x!==id)}));
      Object.values(S.faculty).filter(f => (f.canTeach||[]).includes(id)).forEach(f => putRec('faculty', {...f, canTeach:f.canTeach.filter(x => x!==id)}));
    }
    toast('Deleted. Run Update schedule to refresh the timetables.'); return; }
  const act = t.dataset.act; if (!act) return;
  if (ACT_PERM[act] && !can(ACT_PERM[act]) && !(act === 'move-room' && can('updateSchedule'))){ toast(`Your role (${roleLabel()}) cannot do this.`); return; }
  if (act==='add-faculty') facultyForm();
  if (act==='add-course') courseForm();
  if (act==='add-section') sectionForm();
  if (act==='add-room') roomForm();
  if (act==='split-sections') splitForm();
  if (act==='autoload' || act==='autoload-reset'){
    if (act==='autoload-reset' && !arm(t, 'reset', 'Press again to clear all')) return;
    const r = E.autoLoad(S, act==='autoload-reset');
    if ((ROLES[myAccess().role]||{}).scope){ const a0 = S.schedule.assign || {}, merged = {...a0}; let kept = 0;
      Object.keys({...a0, ...r.assign}).forEach(k => { if ((a0[k]||'') !== (r.assign[k]||'')){ if (classInScope(k, a0[k], r.assign[k])){ if (r.assign[k]) merged[k] = r.assign[k]; else delete merged[k]; } else kept++; } });
      r.assign = merged; if (kept) toast(`Only classes in your ${ROLES[myAccess().role].scope} were changed.`); }
    S.schedule = {...S.schedule, assign:r.assign}; await putDoc('schedule');
    toast(`Loaded ${r.added} class(es). ${r.left} still without a teacher. Run Update schedule next.`);
  }
  if (act==='gen-keep') runGenerate(true);
  if (act==='gen-new'){ if (!arm(t, 'gen', 'Press again to re-plan all')) return; runGenerate(false); }
  if ((act==='csv-tt' || act==='csv-all' || act==='csv-grid') && !gate('download final schedules')) return;
  if (act==='csv-grid'){ const st = E.cfg(S), id = ui.ttId, a = S.schedule.assign||{}, ent = ({Teacher:S.faculty, Section:S.sections, Room:S.rooms})[ui.ttMode][id];
    const ms = S.schedule.meet.filter(m => ui.ttMode==='Teacher' ? a[m.c]===id : ui.ttMode==='Section' ? m.c.split('~')[0]===id : m.r===id);
    const label = m => { const [sid,cid] = m.c.split('~'), f = S.faculty[a[m.c]], c = S.courses[cid]||{};
      const lab = m.k==='LAB' ? ' LAB'+(m.g!=null && groupsOf(m.c)>1 ? ' G'+(m.g+1) : '') : '';
      const who = ui.ttMode==='Teacher' ? `${(S.sections[sid]||{}).name} / ${(S.rooms[m.r]||{}).name}` : ui.ttMode==='Section' ? `${f?f.name:'TBA'} / ${(S.rooms[m.r]||{}).name}` : `${(S.sections[sid]||{}).name} / ${f?f.name:'TBA'}`;
      return `${c.code}${lab} – ${who}`; };
    const rows = [[`${ui.ttMode} schedule: ${(ent||{}).name||''}${ui.ttMode==='Teacher' && roleOf(ent) ? ' – ' + roleOf(ent) : ''}`], [E.cfg(S).term], ['Time', ...DAYS]];
    for (let t = st.start; t + st.slot <= st.end; t += st.slot){
      rows.push([`${fmtS(t)}-${fmtS(t+st.slot)}`, ...DAYS.map((_,d) => { const m = ms.find(x => x.d===d && x.s<=t && x.e>t); return !m ? (st.lunch && t>=st.ls && t<st.le ? 'LUNCH' : '') : m.s===t ? label(m) : '〃'; })]);
    }
    save(`${ui.ttMode} schedule grid - ${(ent||{}).name||''}.csv`, csv(rows)); }
  if (act==='print-pdf'){ printPDF(); return; }
  if (act==='print-html'){ const P = PURPOSES.find(p => p.key === P_.purpose); save(`${P.label} - ${E.cfg(S).term}.html`, printDocHTML()); return; }
  if (act==='perf-addrow'){ setPerf(ui.perfF, p => p.rows.push({f:'core', out:'', q:'', e:'', t:''})); return; }
  if (act==='perf-submit'){ setPerf(ui.perfF, p => p.status = 'submitted'); toast('Submitted for rating.'); return; }
  if (act==='perf-rate'){ if (!can('ratePerformance')) return toast('Only raters can do this.'); setPerf(ui.perfF, p => { p.status = 'rated'; p.ratedBy = me.id || null; }); return; }
  if (act==='perf-approve'){ if (!can('ratePerformance')) return toast('Only raters can do this.'); setPerf(ui.perfF, p => p.status = 'approved'); return; }
  if (act==='perf-return'){ if (!can('ratePerformance')) return toast('Only raters can do this.'); setPerf(ui.perfF, p => p.status = 'draft'); toast('Returned to the faculty member as a draft.'); return; }
  if (act==='perf-syncvs'){ if (!can('ratePerformance')) return; let n = 0;
    for (const f of Object.values(S.faculty).filter(x => canSupervise(x.id) && !E.isPT(x))){ const ok = vsEligible(f.id).ok; if (!!f.vsRating !== ok){ if (!can('editFaculty')){ toast('Updating faculty records needs the right to edit faculty.'); break; } await putRec('faculty', {...f, vsRating: ok}); n++; } }
    toast(n ? `Updated overload eligibility for ${n} faculty.` : 'Overload eligibility already matches the ratings.'); return; }
  if (act==='csv-req'){ const fac = sorted('faculty').filter(f => canSupervise(f.id)), rows = [['Requirements tracker', E.cfg(S).term], [], ['Faculty','Role / designation','Requirement','Group','Status','Link','Date','Note']];

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.assign){
    const cid = t.dataset.assign, a = {...(S.schedule.assign||{})};
    if (t.value){
      const chk = E.checkAssign(S, cid, t.value), st0 = E.cfg(S);

      if (!chk.ok) toast(`Saved with violations: ${chk.reasons[0]}`);
    }
    if (t.value) a[cid] = t.value; else delete a[cid];
    S.schedule = {...S.schedule, assign:a}; await putDoc('schedule');
    const st = E.cfg(S), f = S.faculty[t.value];
    if (f){ const A = E.analysis(S), r = A.rows.find(x => x.f.id===f.id);
      const clash = E.validate(S).issues.filter(i => i.text.includes(f.name));
      toast(clash.length ? `${f.name} now has a time conflict. Press Update schedule to move the class.` : `${f.name}: ${r.units} of ${r.reg} units${r.units>r.max?' — over the maximum':''}.`); }
  }
  if (t.id==='fSec'){ ui.loadSec = t.value; render(); }
  if (t.id==='ttSel'){ ui.ttId = t.value; render(); }
  if (t.id==='qSel'){ ui.qId = t.value; render(); }
  if (t.id==='rqSel'){ ui.rqVal = t.value; render(); }
  if (t.dataset.pset){ P_[t.dataset.pset] = t.value; if (t.dataset.pset === 'purpose'){ const P2 = PURPOSES.find(p => p.key === t.value); P_.orient = (P2 && P2.orient) || 'portrait'; } render(); }
  if (t.dataset.psec){ P_.secs[t.dataset.psec] = t.checked; render(); }
  if (t.dataset.psig){ P_.sig[t.dataset.psig] = t.value; render(); }
  if (t.id === 'dashSel'){ ui.dashF = t.value; render(); }
  if (t.dataset.reqchk){ const [fid, key] = t.dataset.reqchk.split('|'); setReq(fid, key, {s: t.checked ? 'verified' : 'submitted', at:new Date().toISOString()}); }
  if (t.dataset.perfrow){ const [i, k] = t.dataset.perfrow.split(':'); const v = ['q','e','t'].includes(k) ? (t.value === '' ? '' : +t.value) : t.value; setPerf(ui.perfF, p => { p.rows[+i][k] = v; }); }
  if (t.dataset.perfkind){ const kind = t.value; setPerf(ui.perfF, p => { if (p.kind !== kind){ p.kind = kind; if (!p.rows.some(r => r.q || r.e || r.t)) p.rows = ipcrTemplate(kind); } }); }
  if (t.dataset.acc){ const [id, k] = t.dataset.acc.split(':'); putAccess(id, {...(ACCESS[id]||{}), [k]: t.value}); }
  if (t.dataset.tecscore || t.dataset.tecnote || t.dataset.teclet || t.dataset.tectr || t.dataset.tecinterp){
    const T = JSON.parse(JSON.stringify(S.tec || {})); T.scores = T.scores || {}; T.notes = T.notes || {}; T.tracer = T.tracer || {}; T.let = T.let || [];
    const num = v => v === '' ? '' : +v;
    if (t.dataset.tecscore){ if (t.value === '') delete T.scores[t.dataset.tecscore]; else T.scores[t.dataset.tecscore] = +t.value; }
    if (t.dataset.tecnote) T.notes[t.dataset.tecnote] = t.value.trim();
    if (t.dataset.teclet){ const [i,k] = t.dataset.teclet.split(':'); while (T.let.length < 3) T.let.push({year:''}); T.let[+i][k] = k === 'year' ? t.value.trim() : num(t.value); }
